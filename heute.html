      '<div class=note>Jede Karte kommt genau einmal. Danach erscheint sofort das Ergebnis zum Kopieren.</div>' +
      '<div class=opt><label>Richtung<select id=dirsel><option value=eh>Englisch → Hindi</option>' +
      "<option value=he>Hindi → Englisch</option><option value=mix>Gemischt (zufällig)</option></select></label>" +
      "<label><input type=checkbox id=auto checked> Aussprache beim Aufdecken automatisch abspielen</label></div>") +
      '<div class=row>' + btn("main", "start", "Test starten ▶") + "</div>";
    var d = store("hindiTrainerDir");
    if (PICKMODE && !d) { d = "mix"; }
    if (d === "eh" || d === "he" || d === "mix") { document.getElementById("dirsel").value = d; }
  }
  function setupPickIdle(pnote, next) {
    setBanner(""); setResBtn(false); progEl.textContent = ""; setBar(0);
    var toS = document.querySelector("a.tab[href='schrift.html']");
    app.innerHTML = pnote + card(
      '<div class=dir>Deine Wörter</div><div class=en>Heute ist keines deiner Wörter fällig</div>' +
      '<div class=note>' + (next ? "Nächster Test: <b>" + esc(deDate(next)) + "</b>. " : "") + "Deine Wörter: " +
      ALL.map(function (c) { return '<span lang=hi class=hil>' + esc(c.hindi) + "</span>"; }).join(" · ") + "</div>" +
      '<div class=opt><label>Richtung<select id=dirsel><option value=eh>Englisch → Hindi</option>' +
      "<option value=he>Hindi → Englisch</option><option value=mix selected>Gemischt (zufällig)</option></select></label>" +
      "<label><input type=checkbox id=auto checked> Aussprache beim Aufdecken automatisch abspielen</label></div>") +
      (toS ? '<div class=row><a class=main href="schrift.html">Zur Schrift ▶</a></div>' : "") +
      '<div class=row>' + btn("small", "pstart", "Freiwillig üben (zählt nicht)") + "</div>";
  }
  function setupPaused() {
    setBanner("Vokabeln pausiert", ""); setResBtn(false); progEl.textContent = CARDS.length + " Karten"; setBar(0);
    var toS = document.querySelector("a.tab[href='schrift.html']");
    app.innerHTML = card(
      '<div class=dir>Vokabeln · pausiert</div><div class=en>Die Vokabeln sind pausiert</div>' +
      '<div class=note>Du lernst jetzt zuerst die Schrift (Devanagari). Es kommen keine neuen Vokabeln dazu und deine Boxen bleiben, wie sie sind. ' +
      'Wenn es weitergeht, machst du genau dort weiter, wo du aufgehört hast.</div>' +
      '<div class=note>Hier kannst du deine bisherigen ' + CARDS.length + ' Karten freiwillig wiederholen – das zählt nicht.</div>' +
      '<div class=opt><label>Richtung<select id=dirsel><option value=eh>Englisch → Hindi</option>' +
      "<option value=he>Hindi → Englisch</option><option value=mix>Gemischt (zufällig)</option></select></label>" +
      "<label><input type=checkbox id=auto checked> Aussprache beim Aufdecken automatisch abspielen</label></div>") +
      (toS ? '<div class=row><a class=main href="schrift.html">Zur Schrift ▶</a></div>' : "") +
      '<div class=row>' + btn("small", "pstart", "Freiwillig üben (zählt nicht)") + "</div>";
  }
  function startPaused() {
    var sel = document.getElementById("dirsel");
    T = { dir: sel ? sel.value : "eh", auto: !!(document.getElementById("auto") || {}).checked, first: {}, i: 0, done: true, queue: [] };
    startPractice(false);
  }
  function practiceRow() {
    return '<div class=row>' + (PONLY ? btn("small", "restart", "Übung beenden") :
      btn("small", "result", "Ergebnis anzeigen") + btn("small", "endpractice", "Übung beenden")) + "</div>";
  }
  function start() {
    var sel = document.getElementById("dirsel");
    T = { dir: sel ? sel.value : "eh", auto: !!(document.getElementById("auto") || {}).checked, first: {}, i: 0, done: false, date: localToday() };
    store("hindiTrainerDir", T.dir);
    T.queue = shuffle(CARDS).map(function (c) { return { c: c, d: pickDir() }; });
    MODE = "test"; P = null;
    setBanner("Test – zählt", "test"); setResBtn(true, "Ergebnis");
    showCard();
  }
  function cur() { return MODE === "practice" ? P.queue[P.i] : T.queue[T.i]; }
  function front(q) {
    var c = q.c;
    if (q.d === "eh") { return '<div class=dir>Englisch → Hindi</div><div class=en>' + esc(c.english) + "</div>"; }
    return '<div class=dir>Hindi → Englisch</div><div class=hi lang=hi>' + esc(c.hindi) + "</div>" +
      '<div id=hint class="tr hidden">' + esc(c.translit) + "</div>" +
      '<div class="row mt4">' + btn("small", "hint", "Umschrift") + (AUDIO[c.id] ? btn("small", "play", "▶ Anhören", c.id) : "") + "</div>";
  }
  function back(q) {
    var c = q.c, g = c.gender ? "<span class=g>" + esc(c.gender) + "</span>" : "", pl = "";
    if (c.plural) {
      pl = "<div class=pl>" + (c.plural.hindi === "—" ? "" : "Plural: " + esc(c.plural.hindi) + " [" + esc(c.plural.translit) + "] · ") +
        esc((c.plural_note_de || "").replace("Plural-Ausnahme: ", "")) + "</div>";
    }
    var pb = AUDIO[c.id] ? btn("play", "play", "▶", c.id) : "";
    if (q.d === "eh") {
      return '<div class=dir>Englisch → Hindi</div><div class="en dimen">' + esc(c.english) + "</div><div class=sep></div>" +
        "<div class=hi lang=hi>" + esc(c.hindi) + g + "</div><div class=tr>" + esc(c.translit) + "</div>" + pl + pb;
    }
    return '<div class=dir>Hindi → Englisch</div><div class="hi hi2" lang=hi>' + esc(c.hindi) + g + "</div><div class=tr>" + esc(c.translit) + "</div>" + pb +
      "<div class=sep></div><div class=en>" + esc(c.english) + "</div><div class=de>" + esc(c.german) + "</div>" + pl;
  }
  function prog() {
    if (MODE === "practice") {
      progEl.textContent = "Übung " + (P.i + 1) + " / " + P.queue.length + " · Runde " + P.round;
      setBar((P.i) / P.queue.length);
    } else {
      progEl.textContent = (T.i + 1) + " / " + T.queue.length;
      setBar(T.i / T.queue.length);
    }
  }
  function showCard() {
    var q = cur(); if (!q) { return; }
    S.revealed = false; prog();
    app.innerHTML = card(front(q), MODE === "practice" ? " practice" : "") + '<div class=row>' + btn("main", "reveal", "Aufdecken") + "</div>" +
      (MODE === "practice" ? practiceRow() : "") +
      "<div class=keys>Leertaste = aufdecken · 1 = gewusst · 2 = nicht gewusst</div>";
  }
  function reveal() {
    var q = cur(); if (!q || S.revealed) { return; }
    S.revealed = true;
    app.innerHTML = card(back(q), MODE === "practice" ? " practice" : "") + '<div class=row>' + btn("no", "wrong", "✗ Nicht gewusst") + btn("ok", "right", "✓ Gewusst") + "</div>" +
      (MODE === "practice" ? practiceRow() : "") +
      "<div class=keys>1 = gewusst · 2 = nicht gewusst</div>";
    if (T.auto) { play(q.c.id); }
  }
  function ans(ok) {
    var q = cur(); if (!q || !S.revealed) { return; }
    S.revealed = false;
    if (MODE === "test") {
      if (!(q.c.id in T.first)) { T.first[q.c.id] = ok; }
      T.i++;
      if (T.i >= T.queue.length) { T.done = true; return summary(); }   // test ends after exactly one pass
      return showCard();
    }
    if (MODE === "practice") {
      P.n++; if (ok) { P.r++; } else { P.wrongIds[q.c.id] = true; }
      P.i++;
      if (P.i >= P.queue.length) {                                     // new practice round, reshuffled
        P.round++; P.i = 0; P.queue = shuffle(P.pool).map(function (c) { return { c: c, d: pickDir() }; });
      }
      return showCard();
    }
  }
  function resultLine() {
    var ids = CARDS.map(function (c) { return c.id; }).filter(function (id) { return id in T.first; });
    return { ids: ids, line: T.date + ": " + ids.map(function (i) { return i + " " + (T.first[i] ? "right" : "wrong"); }).join(", "),
             nr: ids.filter(function (i) { return T.first[i]; }).length };
  }
  function summary() {
    if (!T) { return setup(); }
    var prev = MODE; MODE = "result";
    var R = resultLine(), complete = T.done;
    setBar(complete ? 1 : T.i / T.queue.length);
    setBanner(complete ? "Test fertig – dieses Ergebnis zählt" : "Zwischenstand – Test noch nicht fertig", complete ? "test" : "");
    setResBtn(false);
    progEl.textContent = R.nr + " / " + R.ids.length + " gewusst";
    var rows = R.ids.map(function (i) {
      var c = byId(i);
      return "<tr><td>" + i + '</td><td lang=hi class=hil>' + esc(c.hindi) + "</td><td>" + esc(c.english) + '</td><td class=' +
        (T.first[i] ? 'r>✓ right' : 'w>✗ wrong') + "</td></tr>";
    }).join("");
    var wrongN = R.ids.length - R.nr, acts = "";
    if (!complete) { acts += btn("main", "resume", "Test fortsetzen (" + (T.i + 1) + "/" + T.queue.length + ")"); }
    else {
      acts += btn("small", "practice-all", "Weiter üben (alle)");
      if (wrongN) { acts += btn("small", "practice-wrong", "Nur falsche üben (" + wrongN + ")"); }
      if (prev === "practice" && P) { acts += btn("small", "practice-resume", "Zurück zur Übung"); }
    }
    acts += btn("ghost", "restart", "Neuer Test (neu gemischt)");
    app.innerHTML = card('<div class=dir>' + (complete ? "Ergebnis Testrunde (zählt)" : "Zwischenstand (" + R.ids.length + " von " + T.queue.length + ")") + '</div>' +
      '<div class=en>' + R.nr + " gewusst · " + wrongN + " nicht gewusst</div>" +
      (R.ids.length ? "<table>" + rows + "</table>" : '<div class=note>Noch keine Karte beantwortet.</div>') +
      '<div class="dir mt10">Zum Kopieren in den Chat</div>' +
      "<textarea id=out readonly>" + esc(R.line) + "</textarea>" +
      '<div class="row mt6">' + btn("main", "copy", "Kopieren") + "</div><div id=copymsg class=note></div>" +
      '<div class="row mt6">' + acts + "</div>", " left");
    if (P && prev === "practice") { P.paused = true; }
  }
  function startPractice(onlyWrong) {
    var pool = CARDS.filter(function (c) { return !onlyWrong || T.first[c.id] === false; });
    if (!pool.length) { pool = CARDS.slice(); }
    P = { pool: pool, round: 1, i: 0, n: 0, r: 0, wrongIds: {} };
    P.queue = shuffle(pool).map(function (c) { return { c: c, d: pickDir() }; });
    MODE = "practice";
    setBanner(PAUSED ? "Vokabeln pausiert – Übung zählt nicht" : "Übung – zählt nicht", ""); setResBtn(!PONLY, "Ergebnis");
    showCard();
  }
  function resumePractice() { if (!P) { return startPractice(false); } MODE = "practice"; setBanner("Übung – zählt nicht", ""); setResBtn(true, "Ergebnis"); showCard(); }
  function resumeTest() { if (!T || T.done) { return summary(); } MODE = "test"; setBanner("Test – zählt", "test"); setResBtn(true, "Ergebnis"); showCard(); }
  function copyOut() {
    var t = document.getElementById("out"), msg = document.getElementById("copymsg");
    function done(ok) { if (msg) { msg.textContent = ok ? "Kopiert ✓" : "Bitte Text markieren und kopieren (Strg+C / lange drücken)."; } }
    try { t.focus(); t.select(); t.setSelectionRange(0, 99999); } catch (e) {}
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    if (ok) { return done(true); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t.value).then(function () { done(true); }, function () { done(false); });
        return;
      }
    } catch (e) {}
    done(false);
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && t.getAttribute("data-act"))) { t = t.parentNode; }
    if (!t || t === document) { return; }
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    try {
      if (act === "start") { start(); }
      else if (act === "pstart") { startPaused(); }
      else if (act === "result") { summary(); }
      else if (act === "resume") { resumeTest(); }
      else if (act === "practice-all") { startPractice(false); }
      else if (act === "practice-wrong") { startPractice(true); }
      else if (act === "practice-resume") { resumePractice(); }
      else if (act === "endpractice") { P = null; summary(); }
      else if (act === "reveal") { reveal(); }
      else if (act === "right") { ans(true); }
      else if (act === "wrong") { ans(false); }
      else if (act === "play") { play(id); }
      else if (act === "hint") { var h = document.getElementById("hint"); if (h) { h.className = "tr"; } }
      else if (act === "copy") { copyOut(); }
      else if (act === "restart") { setup(); }
    } catch (err) { showErr(err && err.message ? err.message : String(err)); }
  }, false);
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if ((MODE !== "test" && MODE !== "practice") || tag === "TEXTAREA" || tag === "SELECT" || tag === "INPUT") { return; }
    var k = e.key || "", code = e.keyCode;
    if (k === " " || code === 32) { if (e.preventDefault) { e.preventDefault(); } if (!S.revealed) { reveal(); } }
    else if (S.revealed && (k === "1" || code === 49 || code === 97)) { ans(true); }
    else if (S.revealed && (k === "2" || code === 50 || code === 98)) { ans(false); }
  }, false);

  try { setup(); } catch (err) { showErr(err && err.message ? err.message : String(err)); }
})();
</script></body></html>
