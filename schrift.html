*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari',sans-serif;background:#f6f4ef;color:#222;display:flex;flex-direction:column;min-height:100vh}
header{background:#7a2e0e;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.05rem;margin:0;font-weight:600}#prog{font-size:.9rem;opacity:.9}
.tabs{display:flex;background:#5c2009}.tab{flex:1;text-align:center;color:#f6dcc4;text-decoration:none;padding:9px 6px;font-weight:600;font-size:.95rem;border-bottom:3px solid transparent}.tab.on{color:#fff;border-bottom-color:#f2b84b;background:#7a2e0e}
#bar{height:5px;background:#e8d9c8}#bar div{height:100%;width:0;background:#f2b84b;transition:width .3s}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px;max-width:680px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.08);width:100%;padding:22px 18px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card.practice{border:3px dashed #f2b84b}.card.left{text-align:left}.card.test{min-height:300px}
.dir{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#a08a74}
.hi,.big,.exhi,.tracel{font-family:'Noto Sans Devanagari','Nirmala UI','Mangal','Kohinoor Devanagari',sans-serif}
.big{font-size:6.5rem;line-height:1.15}.hi{font-size:2rem;line-height:1.3}.mid{font-size:3.2rem;line-height:1.2}
.iast{font-size:2rem;font-weight:600;color:#7a2e0e}.hint{font-size:1.1rem;color:#444}.note{color:#666;font-size:.9rem;line-height:1.4}
.en{font-size:1.4rem;font-weight:500}.small2{font-size:.8rem;color:#888}.sep{border-top:1px dashed #ddd;margin:6px 0}
.box{background:#faf6ef;border-radius:12px;padding:10px 12px;text-align:left;font-size:.95rem;line-height:1.45}
.box b{color:#7a2e0e}.paused{background:#fff3cd;color:#6b4e00;border:1px solid #f0d98a;border-radius:12px;padding:10px 12px;font-weight:600;text-align:left;width:100%;margin-bottom:12px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;width:100%}
button{font:inherit;border:0;border-radius:12px;padding:14px 18px;font-weight:600;cursor:pointer}
.main{background:#7a2e0e;color:#fff;flex:1;min-width:150px;font-size:1.1rem}
.ok{background:#2e7d32;color:#fff;flex:1;font-size:1.1rem}.no{background:#c62828;color:#fff;flex:1;font-size:1.1rem}
.small{background:#f2e3cf;color:#5a2a0a;padding:9px 14px}.play{background:#7a2e0e;color:#fff;border-radius:50%;width:54px;height:54px;font-size:1.25rem;padding:0;align-self:center;flex:none}
.ghost{background:transparent;color:#7a2e0e;text-decoration:underline;padding:8px}
select,label{font:inherit}select{padding:10px;border-radius:10px;border:1px solid #ccc;width:100%;font-size:1rem;background:#fff}
.opt{text-align:left;display:flex;flex-direction:column;gap:12px;margin-top:6px}.opt label{display:flex;gap:8px;align-items:center}
.lessons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.lbtn{background:#f2e3cf;color:#5a2a0a;padding:8px 10px;font-weight:500;font-size:.95rem}
.lbtn .hi{font-size:1.15rem}.lbtn.new{background:#f2b84b;color:#3a1a05}
.stroke{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.stroke figure{margin:0;background:#fff;border:1px solid #eee;border-radius:10px;padding:6px;max-width:100%}
.stroke img{display:block;max-width:100%;height:auto;margin:0 auto}.stroke img.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.stroke figcaption{font-size:.72rem;color:#777;margin-top:4px;text-align:center}.stroke a{color:#7a2e0e}
.ex{display:flex;align-items:center;gap:12px;text-align:left;background:#faf6ef;border-radius:12px;padding:8px 10px}.ex .exhi{font-size:1.8rem}.ex .t{flex:1}
.trace{position:relative;width:100%;max-width:340px;height:280px;margin:6px auto 0;border:2px dashed #e0c9a8;border-radius:14px;background:#fffdf8;overflow:hidden}

.trace canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.95rem}td{padding:6px 4px;border-bottom:1px solid #eee}
.r{color:#2e7d32;font-weight:700}.w{color:#c62828;font-weight:700}
textarea{width:100%;font:inherit;font-size:1rem;padding:10px;border-radius:10px;border:1px solid #ccc;min-height:70px}
.hidden{display:none!important}.keys{color:#aaa;font-size:.75rem;margin-top:10px;text-align:center}
.banner{background:#fff3cd;color:#6b4e00;text-align:center;font-weight:700;padding:7px;font-size:.95rem;border-bottom:1px solid #f0d98a}.banner.test{background:#e8f1fb;color:#1f4e79;border-color:#c6dcf2}
.hdr{display:flex;gap:10px;align-items:center}.hbtn{background:#f2b84b;color:#3a1a05;padding:7px 11px;border-radius:9px;font-size:.85rem}

      '<div class=row>' + btn("small", "clear", "Löschen") + '</div><div class=small2>Nur zum Üben – es wird nichts gespeichert. Richtig schreiben übst du auf Papier.</div></div>';
    var last = LV.i >= LV.n - 1;
    app.innerHTML = card(h) + '<div class=row>' + (LV.i > 0 ? btn("small", "lprev", "◀ Zurück") : btn("small", "home", "◀ Start")) +
      (last ? btn("main", "home", dueList().length ? "Fertig → zum Test" : "Fertig") : btn("main", "lnext", "Weiter ▶")) + "</div>";
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  // finger tracing (nothing stored)
  function initTrace() {
    var cv = document.getElementById("cv"); if (!cv || cv.getAttribute("data-init")) { return; }
    cv.setAttribute("data-init", "1");
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
    var ctx = cv.getContext("2d"); if (!ctx) { return; }
    ctx.scale(dpr, dpr); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 9; ctx.strokeStyle = "#1f4e79";
    var down = false, lx = 0, ly = 0;
    function pos(e) { var b = cv.getBoundingClientRect(); var t = e.touches && e.touches[0] ? e.touches[0] : e; return [t.clientX - b.left, t.clientY - b.top]; }
    function start(e) { down = true; var p = pos(e); lx = p[0]; ly = p[1]; ctx.beginPath(); ctx.arc(lx, ly, 4, 0, 6.3); ctx.fillStyle = "#1f4e79"; ctx.fill(); if (e.preventDefault) { e.preventDefault(); } }
    function move(e) { if (!down) { return; } var p = pos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p[0], p[1]); ctx.stroke(); lx = p[0]; ly = p[1]; if (e.preventDefault) { e.preventDefault(); } }
    function end() { down = false; }
    if (window.PointerEvent) {
      cv.addEventListener("pointerdown", function (e) { try { cv.setPointerCapture(e.pointerId); } catch (x) {} start(e); }, false);
      cv.addEventListener("pointermove", move, false); cv.addEventListener("pointerup", end, false); cv.addEventListener("pointercancel", end, false);
    } else {
      cv.addEventListener("touchstart", start, false); cv.addEventListener("touchmove", move, false); cv.addEventListener("touchend", end, false);
      cv.addEventListener("mousedown", start, false); cv.addEventListener("mousemove", move, false); window.addEventListener("mouseup", end, false);
    }
  }
  function clearTrace() { var cv = document.getElementById("cv"); if (cv) { var c = cv.getContext("2d"); if (c) { c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.restore(); } } }

  // ---------------- Test (counts) / Übung (never counts)
  function pickDir(dir) { return dir === "mix" ? (rnd(2) ? "read" : "write") : dir; }
  function start() {
    var sel = document.getElementById("dirsel");
    T = { dir: sel ? sel.value : "mix", auto: !!(document.getElementById("auto") || {}).checked, first: {}, i: 0, done: false, date: TODAY };
    store("schriftDir", T.dir);
    var due = dueList(); if (!due.length) { return setup(); }
    T.queue = shuffle(due).map(function (c) { return { c: c, d: pickDir(T.dir) }; });
    MODE = "test"; P = null;
    setBanner("Test – zählt", "test"); setResBtn(true, "Ergebnis");
    showCard();
  }
  function cur() { return MODE === "practice" ? P.queue[P.i] : T.queue[T.i]; }
  function front(q) {
    var L = q.c;
    if (q.d === "read") {
      return '<div class=dir>Lesen · Wie klingt das?</div><div class=big lang=hi>' + esc(L.display) + "</div><div class=note>Laut sagen, dann aufdecken.</div>";
    }
    return '<div class=dir>Schreiben · auf Papier</div><div class=small2>' + esc(typeLabel(L)) + "</div>" +
      '<div class=iast>' + esc(L.translit.iast) + '</div><div class=hint>' + esc(L.translit.hint) + "</div>" +
      (L.a ? '<div class=row style="margin-top:4px">' + playBtn(L.a, "▶ Anhören") + "</div>" : "") +
      "<div class=note>Schreib das Zeichen auf Papier, dann aufdecken und vergleichen.</div>";
  }
  function back(q) {
    var L = q.c;
    var h = '<div class=dir>' + (q.d === "read" ? "Lesen" : "Schreiben") + " · Lösung</div>" +
      '<div class=big lang=hi>' + esc(L.display) + "</div>" +
      '<div><span class=iast>' + esc(L.translit.iast) + '</span> <span class=hint>· ' + esc(L.translit.hint) + "</span></div>" + playBtn(L.a);
    h += '<div class=box>' + (q.d === "read" ? "<b>Aussprache:</b> " + esc(L.sound_de) : "<b>Schreiben:</b> " + esc(L.write_de)) + "</div>";
    return h;
  }
  function prog() {
    if (MODE === "practice") { progEl.textContent = "Übung " + (P.i + 1) + " / " + P.queue.length + " · Runde " + P.round; setBar(P.i / P.queue.length); }
    else { progEl.textContent = (T.i + 1) + " / " + T.queue.length; setBar(T.i / T.queue.length); }
  }
  function practiceRow() {
    return '<div class=row>' + (T && T.done ? btn("small", "result", "Ergebnis anzeigen") + btn("small", "endpractice", "Übung beenden") : btn("small", "home", "Übung beenden")) + "</div>";
  }
  function showCard() {
    var q = cur(); if (!q) { return; }
    S.revealed = false; prog();
    app.innerHTML = card(front(q), " test" + (MODE === "practice" ? " practice" : "")) + '<div class=row>' + btn("main", "reveal", "Aufdecken") + "</div>" +
      (MODE === "practice" ? practiceRow() : "") + "<div class=keys>Leertaste = aufdecken · 1 = gewusst · 2 = nicht gewusst</div>";
    if (q.d === "write" && T && T.auto) { play(q.c.a); }
  }
  function reveal() {
    var q = cur(); if (!q || S.revealed) { return; }
    S.revealed = true;
    app.innerHTML = card(back(q), " test" + (MODE === "practice" ? " practice" : "")) + '<div class=row>' + btn("no", "wrong", "✗ Nicht gewusst") + btn("ok", "right", "✓ Gewusst") + "</div>" +
      (MODE === "practice" ? practiceRow() : "") + "<div class=keys>1 = gewusst · 2 = nicht gewusst</div>";
    if (q.d === "read" && T && T.auto) { play(q.c.a); }
  }
  function ans(ok) {
    var q = cur(); if (!q || !S.revealed) { return; }
    S.revealed = false;
    if (MODE === "test") {
      if (!(q.c.id in T.first)) { T.first[q.c.id] = ok; }
      T.i++;
      if (T.i >= T.queue.length) { T.done = true; return summary(); }   // test ends after exactly one pass
      return showCard();
    }
    if (MODE === "practice") {
      P.n++; P.i++;
      if (P.i >= P.queue.length) { P.round++; P.i = 0; P.queue = shuffle(P.pool).map(function (c) { return { c: c, d: pickDir(P.dir) }; }); }
      return showCard();
    }
  }
  function resultLine() {
    var ids = T.queue.map(function (q) { return q.c.id; }).sort(function (a, b) { return a - b; }).filter(function (id) { return id in T.first; });
    return { ids: ids, nr: ids.filter(function (i) { return T.first[i]; }).length,
             line: "Schrift " + T.date + ": " + ids.map(function (i) { return i + " " + byId(i).display + " " + (T.first[i] ? "right" : "wrong"); }).join(", ") };
  }
  function summary() {
    if (!T) { return setup(); }
    var prev = MODE; MODE = "result";
    var R = resultLine(), complete = T.done;
    if (complete) { LASTT = T; }
    setBar(complete ? 1 : T.i / T.queue.length);
    setBanner(complete ? "Test fertig – dieses Ergebnis zählt" : "Zwischenstand – Test noch nicht fertig", complete ? "test" : "");
    setResBtn(false);
    progEl.textContent = R.nr + " / " + R.ids.length + " gewusst";
    var rows = R.ids.map(function (i) { var c = byId(i); return "<tr><td>" + i + '</td><td lang=hi class=hi>' + esc(c.display) + "</td><td>" + esc(c.translit.iast) + "</td><td class=" + (T.first[i] ? 'r>✓ right' : 'w>✗ wrong') + "</td></tr>"; }).join("");
    var wrongN = R.ids.length - R.nr, acts = "";
    if (!complete) { acts += btn("main", "resume", "Test fortsetzen (" + (T.i + 1) + "/" + T.queue.length + ")"); }
    else {
      acts += btn("small", "practice-all", "Weiter üben (alle)");
      if (wrongN) { acts += btn("small", "practice-wrong", "Nur falsche üben (" + wrongN + ")"); }
      if (prev === "practice" && P) { acts += btn("small", "practice-resume", "Zurück zur Übung"); }
    }
    acts += btn("ghost", "restart", "Neuer Test (neu gemischt)") + btn("ghost", "home", "Start");
    app.innerHTML = card('<div class=dir>' + (complete ? "Ergebnis Schrift-Test (zählt)" : "Zwischenstand (" + R.ids.length + " von " + T.queue.length + ")") + "</div>" +
      '<div class=en>' + R.nr + " gewusst · " + wrongN + " nicht gewusst</div>" +
      (R.ids.length ? "<table>" + rows + "</table>" : '<div class=note>Noch kein Zeichen beantwortet.</div>') +
      '<div class=dir style="margin-top:10px">Zum Kopieren in den Chat</div>' +
      "<textarea id=out readonly>" + esc(R.line) + "</textarea>" +
      '<div class=row>' + btn("main", "copy", "Kopieren") + "</div><div id=copymsg class=note></div>" +
      '<div class=row>' + acts + "</div>", " left");
  }
  function startPractice(onlyWrong, free) {
    var pool;
    if (free || !T) { pool = LETTERS.slice(); T = null; }
    else { pool = T.queue.map(function (q) { return q.c; }).filter(function (c) { return !onlyWrong || T.first[c.id] === false; }); }
    if (!pool.length) { pool = LETTERS.slice(); }
    var sel = document.getElementById("dirsel"), dir = T ? T.dir : (sel ? sel.value : (store("schriftDir") || "mix"));
    P = { pool: pool, round: 1, i: 0, n: 0, dir: dir };
    if (!T) { T = { dir: dir, auto: true, first: {}, i: 0, done: false, queue: [], practiceOnly: true }; }
    P.queue = shuffle(pool).map(function (c) { return { c: c, d: pickDir(dir) }; });
    MODE = "practice";
    setBanner("Übung – zählt nicht", ""); setResBtn(!!T.done, "Ergebnis");
    showCard();
  }
  function resumePractice() { if (!P) { return startPractice(false); } MODE = "practice"; setBanner("Übung – zählt nicht", ""); setResBtn(true, "Ergebnis"); showCard(); }
  function resumeTest() { if (!T || T.done) { return summary(); } MODE = "test"; setBanner("Test – zählt", "test"); setResBtn(true, "Ergebnis"); showCard(); }
  function copyOut() {
    var t = document.getElementById("out"), msg = document.getElementById("copymsg");
    function done(ok) { if (msg) { msg.textContent = ok ? "Kopiert ✓" : "Bitte Text markieren und kopieren (Strg+C / lange drücken)."; } }
    try { t.focus(); t.select(); t.setSelectionRange(0, 99999); } catch (e) {}
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    if (ok) { return done(true); }
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t.value).then(function () { done(true); }, function () { done(false); }); return; } } catch (e) {}
    done(false);
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && t.getAttribute("data-act"))) { t = t.parentNode; }
    if (!t || t === document) { return; }
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    try {
      if (act === "start") { start(); }
      else if (act === "learn") { learn(parseInt(id, 10), 0); }
      else if (act === "lnext") { if (LV && LV.i < LV.n - 1) { LV.i++; showLearn(); } }
      else if (act === "lprev") { if (LV && LV.i > 0) { LV.i--; showLearn(); } }
      else if (act === "home") { setup(); }
      else if (act === "lastres") { if (LASTT) { T = LASTT; P = null; summary(); } }
      else if (act === "trace") { var tb = document.getElementById("tracebox"); if (tb) { tb.className = /hidden/.test(tb.className) ? "" : "hidden"; initTrace(); } }
      else if (act === "clear") { clearTrace(); }
      else if (act === "result") { summary(); }
      else if (act === "resume") { resumeTest(); }
      else if (act === "practice-all") { startPractice(false); }
      else if (act === "practice-wrong") { startPractice(true); }
      else if (act === "practice-free") { startPractice(false, true); }
      else if (act === "practice-resume") { resumePractice(); }
      else if (act === "endpractice") { P = null; summary(); }
      else if (act === "reveal") { reveal(); }
      else if (act === "right") { ans(true); }
      else if (act === "wrong") { ans(false); }
      else if (act === "play") { play(id); }
      else if (act === "copy") { copyOut(); }
      else if (act === "restart") { setup(); }
    } catch (err) { showErr(err && err.message ? err.message : String(err)); }
  }, false);
  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "TEXTAREA" || tag === "SELECT" || tag === "INPUT") { return; }
    var k = e.key || "", code = e.keyCode;
    if (MODE === "learn") {
      if (k === "ArrowRight" || code === 39) { if (LV.i < LV.n - 1) { LV.i++; showLearn(); } }
      else if (k === "ArrowLeft" || code === 37) { if (LV.i > 0) { LV.i--; showLearn(); } }
      return;
    }
    if (MODE !== "test" && MODE !== "practice") { return; }
    if (k === " " || code === 32) { if (e.preventDefault) { e.preventDefault(); } if (!S.revealed) { reveal(); } }
    else if (S.revealed && (k === "1" || code === 49 || code === 97)) { ans(true); }
    else if (S.revealed && (k === "2" || code === 50 || code === 98)) { ans(false); }
  }, false);
  try { setup(); } catch (err) { showErr(err && err.message ? err.message : String(err)); }
})();
</script></body></html>
